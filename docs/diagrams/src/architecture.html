<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_style.css"><style>@page{size:1100px 780px;margin:0}</style><title>Software Architecture Diagram</title></head><body>
<svg width="1100" height="780" viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2f5d8a"/></marker></defs>
<text x="30" y="38" class="h">Snake Game — Software Architecture (Layered, single process)</text>
<text x="30" y="60" class="s">C++17 · SFML 2.6 · CMake · GoogleTest · GitHub Actions.  Owners shown in brackets.</text>
<!-- player -->
<rect x="440" y="80" width="220" height="44" rx="22" class="ext"/><text x="550" y="107" text-anchor="middle" class="t b">Player (keyboard + screen)</text>
<path d="M550 124 V160" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
<!-- presentation -->
<rect x="20" y="160" width="1060" height="120" rx="8" class="lay"/><text x="34" y="180" class="s b">PRESENTATION LAYER  (depends on SFML)</text>
<rect x="60" y="192" width="300" height="72" rx="6" class="box"/><text x="210" y="220" text-anchor="middle" class="t b">Input / Event Loop</text><text x="210" y="242" text-anchor="middle" class="s">src/main.cpp — pollEvent, key mapping</text><text x="210" y="258" text-anchor="middle" class="s">[Tushar]</text>
<rect x="400" y="192" width="300" height="72" rx="6" class="box"/><text x="550" y="220" text-anchor="middle" class="t b">Renderer + HUD</text><text x="550" y="242" text-anchor="middle" class="s">grid, snake, food, score/best, FPS, overlays</text><text x="550" y="258" text-anchor="middle" class="s">[Tushar, Vrunda (best score), Charan (FPS)]</text>
<rect x="740" y="192" width="300" height="72" rx="6" class="ext"/><text x="890" y="220" text-anchor="middle" class="t b">SFML 2.6 (external)</text><text x="890" y="242" text-anchor="middle" class="s">RenderWindow, Event, Clock, Font, Shapes</text><text x="890" y="258" text-anchor="middle" class="s">assets/arial.ttf (read-only)</text>
<path d="M360 228 H400" class="ln" marker-end="url(#a)"/><path d="M700 228 H740" class="ln" marker-end="url(#a)"/>
<path d="M210 264 V330" class="ln" marker-end="url(#a)"/><text x="218" y="304" class="lbl">handleDirectionInput / startRound / restart</text>
<path d="M550 330 V264" class="ln dash" marker-end="url(#a)"/><text x="558" y="304" class="lbl">read-only getters (state, snake, food, score)</text>
<!-- application -->
<rect x="20" y="330" width="1060" height="120" rx="8" class="lay"/><text x="34" y="350" class="s b">APPLICATION LAYER  (lifecycle + orchestration)</text>
<rect x="200" y="362" width="700" height="74" rx="6" class="box"/><text x="550" y="388" text-anchor="middle" class="t b">GameController  — state machine  [Tushar]</text>
<text x="550" y="408" text-anchor="middle" class="s">Ready → Playing → GameOver | RoundComplete   ·   fixed-timestep update(dt), 0.15 s per move</text>
<text x="550" y="426" text-anchor="middle" class="s">step(): nextHead → willGrow? → collision check → commit advance → score + replace food</text>
<path d="M300 436 V500" class="ln" marker-end="url(#a)"/><path d="M480 436 V500" class="ln" marker-end="url(#a)"/><path d="M640 436 V500" class="ln" marker-end="url(#a)"/><path d="M820 436 V500" class="ln" marker-end="url(#a)"/>
<!-- domain -->
<rect x="20" y="500" width="1060" height="150" rx="8" class="lay"/><text x="34" y="520" class="s b">DOMAIN LAYER  (pure game rules — unit-testable headlessly)</text>
<rect x="40" y="532" width="240" height="104" rx="6" class="box"/><text x="160" y="558" text-anchor="middle" class="t b">Snake</text><text x="160" y="578" text-anchor="middle" class="s">body, direction, input latch</text><text x="160" y="594" text-anchor="middle" class="s">changeDirection (no 180°)</text><text x="160" y="610" text-anchor="middle" class="s">advance(grow), reset</text><text x="160" y="628" text-anchor="middle" class="s">[Charan]</text>
<rect x="300" y="532" width="240" height="104" rx="6" class="box"/><text x="420" y="558" text-anchor="middle" class="t b">FoodManager</text><text x="420" y="578" text-anchor="middle" class="s">place on free cell (mt19937)</text><text x="420" y="594" text-anchor="middle" class="s">isAt, BoardFull, InvalidBounds</text><text x="420" y="610" text-anchor="middle" class="s">no infinite retry loop</text><text x="420" y="628" text-anchor="middle" class="s">[Vrunda]</text>
<rect x="560" y="532" width="240" height="104" rx="6" class="box"/><text x="680" y="558" text-anchor="middle" class="t b">ScoreManager</text><text x="680" y="578" text-anchor="middle" class="s">+10 per food, foods eaten</text><text x="680" y="594" text-anchor="middle" class="s">session best score</text><text x="680" y="610" text-anchor="middle" class="s">resetRound keeps best</text><text x="680" y="628" text-anchor="middle" class="s">[Vrunda]</text>
<rect x="820" y="532" width="240" height="104" rx="6" class="box"/><text x="940" y="558" text-anchor="middle" class="t b">CollisionDetector</text><text x="940" y="578" text-anchor="middle" class="s">boundary + self check</text><text x="940" y="594" text-anchor="middle" class="s">departing-tail rule (TC-05)</text><text x="940" y="610" text-anchor="middle" class="s">pure, side-effect free</text><text x="940" y="628" text-anchor="middle" class="s">[Ved]</text>
<text x="550" y="666" text-anchor="middle" class="s">Shared value types: grid_types.h — Cell, BoardBounds, Body, CollisionType</text>
<!-- cross cutting -->
<rect x="20" y="684" width="1060" height="78" rx="8" class="test"/><text x="34" y="704" class="s b">CROSS-CUTTING: QUALITY &amp; DEVOPS</text>
<text x="40" y="728" class="s">73 automated tests (GoogleTest + standalone) · CI: build/test, ASan+UBSan, cppcheck, security scan (SR-02/03), macOS build</text>
<text x="40" y="748" class="s">CD: tag v*.*.* → test gate → Linux/macOS packages (CPack) + SBOM (SPDX) + SHA256 → GitHub Release</text>
</svg></body></html>
